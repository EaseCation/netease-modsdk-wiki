name: Deploy VitePress to AliYun OSS

on:
  # 每次推送到main分支时触发部署
  push:
    branches: [main]
  # 允许手动触发工作流
  workflow_dispatch:

# 设置GITHUB_TOKEN的权限
permissions:
  contents: read
  id-token: write

concurrency:
  group: modsdk-wiki-production
  cancel-in-progress: false

jobs:
  # 构建工作
  build-and-deploy:
    if: github.repository == 'EaseCation/netease-modsdk-wiki' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, modsdk-wiki-deploy]
    timeout-minutes: 60
    env:
      ALIYUN_REGION: ${{ vars.ALIYUN_REGION || 'cn-hangzhou' }}
      OSS_BUCKET: ${{ vars.OSS_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 部署仅需要当前版本，避免首次下载数 GB 的历史附件。
          fetch-depth: 1
          lfs: true
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 自托管 runner 保留本地 npm 缓存，避免从 GitHub 恢复大体积缓存。
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
          
      - name: Install dependencies
        run: npm ci
        
      - name: Checkout retrieval Skill
        uses: actions/checkout@v4
        with:
          repository: EaseCation/netease-modsdk-skill
          # 固定已复核的题库和执行器；升级时显式更新此提交。
          ref: 7c84afafaca1fbb01860c051ff0d06fadde3339a
          path: .retrieval-skill
          persist-credentials: false

      - name: Check retrieval regressions
        env:
          MODSDK_WIKI_ROOT: ${{ github.workspace }}
        run: |
          python3 .retrieval-skill/scripts/evaluate.py
          python3 .retrieval-skill/scripts/evaluate.py --market
          python3 .retrieval-skill/scripts/evaluate.py --guides

      - name: Build with VitePress
        run: npm run docs:build

      - name: Check generated links
        run: npm run docs:check-links

      - name: Validate search records
        run: npm run docs:algolia -- --dry-run

      # docs/.vitepress/dist
        
      - name: Install Aliyun CLI
        run: |
          set -euo pipefail
          umask 077
          deploy_dir="$RUNNER_TEMP/modsdk-aliyun-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$deploy_dir/bin"
          curl -fL --retry 2 -o "$deploy_dir/aliyun.tgz" \
            https://github.com/aliyun/aliyun-cli/releases/download/v3.5.2/aliyun-cli-macosx-3.5.2-arm64.tgz
          printf '%s  %s\n' 076e14de5450e4d61c59a54957e72529a644e8e4309b6ff5118d01db2c4aca6f "$deploy_dir/aliyun.tgz" | shasum -a 256 -c -
          tar -xzf "$deploy_dir/aliyun.tgz" -C "$deploy_dir/bin"
          printf '%s\n' "$deploy_dir/bin" >> "$GITHUB_PATH"
          printf 'ALIYUN_CONFIG_FILE=%s/config.json\n' "$deploy_dir" >> "$GITHUB_ENV"

      - name: Configure Aliyun temporary credentials
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars.ALIYUN_STATIC_DEPLOY_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          role-session-name: gh-${{ github.repository_id }}-${{ github.run_id }}
          role-session-expiration: 3600
          audience: sts.aliyuncs.com

      - name: Configure Aliyun CLI
        run: |
          set -euo pipefail
          test -n "$ALIBABA_CLOUD_ACCESS_KEY_ID"
          test -n "$ALIBABA_CLOUD_ACCESS_KEY_SECRET"
          test -n "$ALIBABA_CLOUD_SECURITY_TOKEN"
          umask 077
          aliyun configure set \
            --config-path "$ALIYUN_CONFIG_FILE" \
            --mode StsToken \
            --region "$ALIYUN_REGION" \
            --access-key-id "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
            --access-key-secret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
            --sts-token "$ALIBABA_CLOUD_SECURITY_TOKEN"

      - name: Upload to Aliyun OSS
        run: |
          set -euo pipefail
          test -n "$OSS_BUCKET"
          aliyun --config-path "$ALIYUN_CONFIG_FILE" ossutil cp -r ./docs/.vitepress/dist/ "oss://${OSS_BUCKET}/" \
            --region "$ALIYUN_REGION" \
            --force

      - name: Clean deployment credentials and tools
        if: always()
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/modsdk-aliyun-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
